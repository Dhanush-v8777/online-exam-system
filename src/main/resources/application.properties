spring.application.name=SmartExam

# =========================================
# DATABASE CONFIGURATION
# =========================================
spring.datasource.url=jdbc:mysql://localhost:3306/smartexam_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1414
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# =========================================
# JPA / HIBERNATE CONFIGURATION
# =========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =========================================
# THYMELEAF CONFIGURATION
# =========================================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# =========================================
# SERVER CONFIGURATION
# =========================================
server.port=8081
server.servlet.context-path=/
server.servlet.session.timeout=60m

# =========================================
# SPRING SECURITY
# =========================================
spring.security.user.name=admin
spring.security.user.password=changeme

# =========================================
# MAIL CONFIGURATION (Optional - comment out if not using email)
# =========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Flag to enable/disable email notifications
app.mail.enabled=false

# =========================================
# APPLICATION CONFIGURATION
# =========================================
app.institution.name=SmartExam University
app.institution.address=123 University Road, Academic City
app.admin.email=admin@smartexam.edu
app.admin.default-password=Admin@123

# =========================================
# FILE UPLOAD
# =========================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# =========================================
# LOGGING
# =========================================
logging.level.com.examscheduler=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
