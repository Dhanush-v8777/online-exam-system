<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Notice | SmartExam</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #f1f5f9; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: 'Inter', sans-serif; }
        .card { border-radius: 16px; border: none; box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 40px; text-align: center; max-width: 480px; background: #fff; }
        .icon-circle { width: 72px; height: 72px; border-radius: 50%; background: #eff6ff; display: flex; align-items: center; justify-content: center; font-size: 2rem; color: #2563eb; margin: 0 auto 16px; }
    </style>
</head>
<body>
<div class="card">
    <div class="icon-circle"><i class="bi bi-info-circle"></i></div>
    <h4 class="fw-bold mb-2" style="color:#0f172a;" th:text="${errorTitle ?: 'Notice'}">Application Notice</h4>
    <p class="text-muted mb-4" style="font-size: 0.9rem;" th:text="${errorMessage ?: 'An unexpected condition was reported.'}">Notice details.</p>
    <div>
        <a href="javascript:history.back()" class="btn btn-primary" style="background:#2563eb;border:none;border-radius:8px;padding:8px 20px;">Return</a>
    </div>
</div>
</body>
</html>
