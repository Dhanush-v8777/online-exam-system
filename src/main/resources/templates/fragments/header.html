<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- REUSABLE TOPBAR WITH NOTIFICATIONS, AVATAR, ROLE & LOGOUT -->
<header th:fragment="topbar(title)" class="topbar">
    <div class="topbar-title" th:text="${title}">Dashboard</div>
    <div class="d-flex align-items-center gap-3">
        <!-- Notification Bell Dropdown -->
        <div class="dropdown">
            <button class="btn btn-light btn-sm notification-btn border position-relative" type="button" id="headerNotificationDropdown" data-bs-toggle="dropdown" aria-expanded="false" title="Notifications">
                <i class="bi bi-bell"></i>
                <span class="notification-badge" id="headerNotificationBadge"
                      th:if="${unreadNotifications != null and unreadNotifications > 0}"
                      th:text="${unreadNotifications}">0</span>
            </button>
            <div class="dropdown-menu dropdown-menu-end shadow-lg p-0" aria-labelledby="headerNotificationDropdown" style="width: 360px; max-width: 92vw; border-radius: 10px; border: 1px solid #e2e8f0; overflow: hidden; z-index: 1050;">
                <div class="d-flex align-items-center justify-content-between px-3 py-2 bg-light border-bottom">
                    <div class="d-flex align-items-center gap-1">
                        <i class="bi bi-bell-fill text-primary"></i>
                        <span class="fw-bold small text-navy">Notifications</span>
                    </div>
                    <span class="badge bg-primary" id="headerDropdownUnreadCount" th:text="${(unreadNotifications != null ? unreadNotifications : 0) + ' unread'}">0 unread</span>
                </div>
                <div class="header-notification-list" style="max-height: 330px; overflow-y: auto;">
                    <th:block th:if="${headerNotifications != null and !headerNotifications.isEmpty()}">
                        <a th:each="n : ${headerNotifications}"
                           th:href="@{/notifications/open/{id}(id=${n.id})}"
                           class="dropdown-item py-2 px-3 border-bottom d-flex align-items-start gap-2 text-wrap"
                           th:style="${!n.isRead ? 'background:#f0f7ff;' : ''}">
                            <i class="bi mt-1 fs-6"
                               th:classappend="${n.notificationType.name() == 'INVIGILATION_ASSIGNED' or n.notificationType.name() == 'DUTY_REASSIGNED' ? 'bi-person-badge-fill text-primary' : (n.notificationType.name() == 'CONFLICT_DETECTED' ? 'bi-exclamation-triangle-fill text-danger' : (n.notificationType.name() == 'ROOM_CHANGED' or n.notificationType.name() == 'EXAM_RESCHEDULED' ? 'bi-calendar-event text-warning' : 'bi-bell-fill text-info'))}"></i>
                            <div class="flex-grow-1" style="min-width: 0;">
                                <div class="d-flex justify-content-between align-items-baseline">
                                    <span class="small fw-semibold text-truncate" th:text="${n.title}">Notification Title</span>
                                    <span th:if="${!n.isRead}" class="badge bg-primary p-1 rounded-circle ms-1" style="width:7px; height:7px;" title="Unread"></span>
                                </div>
                                <div class="text-secondary small text-truncate" style="font-size: 0.76rem;" th:text="${n.message}">Message preview</div>
                                <div class="text-muted small" style="font-size: 0.68rem;" th:text="${#temporals.format(n.createdAt, 'dd MMM, HH:mm')}">Date</div>
                            </div>
                        </a>
                    </th:block>
                    <div th:if="${headerNotifications == null or headerNotifications.isEmpty()}" class="p-4 text-center text-muted small">
                        <i class="bi bi-bell-slash d-block fs-3 mb-1 text-secondary opacity-50"></i>
                        No notifications yet
                    </div>
                </div>
                <div class="d-flex justify-content-between align-items-center px-3 py-2 bg-light border-top">
                    <form th:action="@{/notifications/mark-all-read}" method="post" class="m-0" th:if="${unreadNotifications != null and unreadNotifications > 0}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn btn-link btn-sm p-0 text-decoration-none text-muted" style="font-size:0.75rem;">
                            <i class="bi bi-check2-all me-1"></i>Mark all read
                        </button>
                    </form>
                    <a href="/notifications" class="text-primary fw-semibold text-decoration-none ms-auto" style="font-size:0.75rem;">
                        View all inbox <i class="bi bi-arrow-right"></i>
                    </a>
                </div>
            </div>
        </div>
        <div class="d-flex align-items-center gap-2">
            <div class="user-avatar" th:text="${currentUser != null and currentUser.fullName != null and !currentUser.fullName.isEmpty() ? currentUser.fullName.substring(0, 1).toUpperCase() : 'U'}">U</div>
            <div>
                <div class="fw-semibold" style="font-size:0.83rem; color:var(--navy);" th:text="${currentUser != null ? currentUser.fullName : 'SmartExam User'}">User</div>
                <div class="text-muted" style="font-size:0.7rem;" th:text="${currentUser != null ? currentUser.role : 'ROLE'}">ADMIN</div>
            </div>
        </div>
        <form th:action="@{/logout}" method="post" class="m-0">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn btn-sm btn-outline-danger ms-2"><i class="bi bi-box-arrow-right me-1"></i> Sign Out</button>
        </form>
    </div>
    <script>
        // Prevent browser back-forward cache from showing protected content after logout
        window.addEventListener('pageshow', function (event) {
            if (event.persisted || (window.performance && window.performance.navigation && window.performance.navigation.type === 2)) {
                window.location.reload();
            }
        });
    </script>
</header>

</body>
</html>
