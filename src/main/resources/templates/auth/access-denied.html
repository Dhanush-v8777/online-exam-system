<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Access Denied | SmartExam</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #f1f5f9; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: 'Inter', sans-serif; }
        .card { border-radius: 16px; border: none; box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 48px; text-align: center; max-width: 440px; background: #fff; }
        .icon-circle { width: 80px; height: 80px; border-radius: 50%; background: #fee2e2; display: flex; align-items: center; justify-content: center; font-size: 2.2rem; color: #ef4444; margin: 0 auto 20px; }
    </style>
</head>
<body>
<div class="card">
    <div class="icon-circle"><i class="bi bi-shield-x"></i></div>
    <h3 class="fw-bold mb-2" style="color:#0f172a;">Access Restricted</h3>
    <p class="text-muted mb-4" style="font-size: 0.9rem;">Your account does not possess sufficient role privileges to view this section.</p>
    <div class="d-flex justify-content-center gap-2">
        <a href="javascript:history.back()" class="btn btn-primary" style="background:#2563eb;border:none;border-radius:8px;">Go Back</a>
        <a href="/login" class="btn btn-outline-secondary" style="border-radius:8px;">Switch Account</a>
    </div>
</div>
</body>
</html>
