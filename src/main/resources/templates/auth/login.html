<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SmartExam</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #0f172a 100%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; margin: 0;
        }
        .login-card {
            background: #fff; border-radius: 20px; padding: 44px 38px; width: 100%;
            max-width: 440px; box-shadow: 0 25px 50px rgba(0,0,0,0.35);
        }
        .brand-icon {
            width: 60px; height: 60px; border-radius: 16px;
            background: linear-gradient(135deg, #2563eb, #1e3a8a);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.8rem; color: #fff; margin: 0 auto 16px;
        }
        .login-title { font-size: 1.5rem; font-weight: 700; color: #0f172a; text-align: center; margin: 0; }
        .login-sub { color: #64748b; font-size: 0.85rem; text-align: center; margin: 6px 0 24px; }
        .form-label { font-size: 0.85rem; font-weight: 500; color: #374151; }
        .form-control { border: 1.5px solid #d1d5db; border-radius: 10px; padding: 11px 14px; font-size: 0.9rem; }
        .form-control:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.12); }
        .input-group-text { background: #f8fafc; border: 1.5px solid #d1d5db; border-radius: 10px 0 0 10px; color: #6b7280; }
        .btn-toggle-pwd {
            background: #f8fafc; border: 1.5px solid #d1d5db; border-left: none;
            border-radius: 0 10px 10px 0; color: #64748b; padding: 0 14px;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            transition: all 0.15s ease-in-out;
        }
        .btn-toggle-pwd:hover, .btn-toggle-pwd:focus {
            background: #f1f5f9; color: #2563eb; outline: none; box-shadow: none;
        }
        .btn-login {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #fff; border: none; border-radius: 10px; padding: 12px;
            font-size: 1rem; font-weight: 600; width: 100%; margin-top: 10px;
            transition: all 0.2s;
        }
        .btn-login:hover { background: linear-gradient(135deg, #1d4ed8, #1e3a8a); color: #fff; }
        .alert-custom { border-radius: 10px; padding: 12px 14px; font-size: 0.85rem; margin-bottom: 18px; }
    </style>
</head>
<body>
<div class="login-card">
    <div class="brand-icon"><i class="bi bi-mortarboard-fill"></i></div>
    <h1 class="login-title">SmartExam</h1>
    <p class="login-sub">Intelligent Examination Scheduling & Invigilation System</p>

    <div th:if="${errorMsg}" class="alert alert-danger alert-custom" th:text="${errorMsg}"></div>
    <div th:if="${logoutMsg}" class="alert alert-success alert-custom" th:text="${logoutMsg}"></div>

    <form action="/login" method="post" autocomplete="off" id="loginForm">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        
        <div class="mb-3">
            <label for="email" class="form-label">Email Address</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control" id="email" name="email"
                       placeholder="Enter your institutional email" required autofocus autocomplete="off"
                       style="border-radius: 0 10px 10px 0;">
            </div>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control border-end-0" id="password" name="password"
                       placeholder="Enter your password" required autocomplete="new-password"
                       style="border-radius: 0;">
                <button type="button" class="btn btn-toggle-pwd" id="togglePasswordBtn"
                        aria-label="Show or hide password" title="Toggle password visibility">
                    <i class="bi bi-eye" id="togglePasswordIcon"></i>
                </button>
            </div>
        </div>

        <button type="submit" class="btn btn-login">
            <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
        </button>
    </form>
</div>

<script>
    // 1. Password Visibility Toggle (Show / Hide Password)
    const togglePasswordBtn = document.getElementById('togglePasswordBtn');
    const passwordInput = document.getElementById('password');
    const togglePasswordIcon = document.getElementById('togglePasswordIcon');

    if (togglePasswordBtn && passwordInput && togglePasswordIcon) {
        togglePasswordBtn.addEventListener('click', function(e) {
            e.preventDefault();
            const currentType = passwordInput.getAttribute('type');
            if (currentType === 'password') {
                passwordInput.setAttribute('type', 'text');
                togglePasswordIcon.classList.remove('bi-eye');
                togglePasswordIcon.classList.add('bi-eye-slash');
            } else {
                passwordInput.setAttribute('type', 'password');
                togglePasswordIcon.classList.remove('bi-eye-slash');
                togglePasswordIcon.classList.add('bi-eye');
            }
            passwordInput.focus();
        });
    }

    // 2. Ensure fields are strictly empty upon opening login page
    window.addEventListener('DOMContentLoaded', function() {
        const errorPresent = document.querySelector('.alert-danger');
        if (!errorPresent) {
            const emailInput = document.getElementById('email');
            const pwdInput = document.getElementById('password');
            if (emailInput && !emailInput.value.includes('@')) emailInput.value = '';
            if (pwdInput) pwdInput.value = '';
        }
    });

    // 3. Fix Back Button Navigation: If user presses Back to this page, force a fresh check
    window.addEventListener('pageshow', function(event) {
        if (event.persisted || (window.performance && window.performance.navigation && window.performance.navigation.type === 2)) {
            window.location.reload();
        }
    });
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
