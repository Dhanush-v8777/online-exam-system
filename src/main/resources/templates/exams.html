<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Exams | Exam Scheduler</title>


<style>
    * {
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        margin: 0;
        padding: 30px 15px;
        background: #f3f6fb;
        color: #1e293b;
    }

    .container {
        max-width: 1100px;
        margin: auto;
    }

    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 15px;
        margin-bottom: 25px;
    }

    h1 {
        color: #1d4ed8;
        margin-bottom: 8px;
    }

    .subtitle {
        color: #64748b;
    }

    .button {
        display: inline-block;
        padding: 12px 18px;
        background: #1d4ed8;
        color: white;
        border-radius: 7px;
        text-decoration: none;
    }

    .button:hover {
        background: #1e40af;
    }

    .back {
        background: #e2e8f0;
        color: #1e293b;
    }

    .back:hover {
        background: #cbd5e1;
    }

    .message {
        padding: 14px;
        margin-bottom: 20px;
        border-radius: 7px;
        background: #dcfce7;
        color: #166534;
    }

    .table-container {
        overflow-x: auto;
        background: white;
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    }

    table {
        width: 100%;
        border-collapse: collapse;
        min-width: 650px;
    }

    th, td {
        padding: 15px;
        text-align: left;
        border-bottom: 1px solid #e2e8f0;
    }

    th {
        background: #eff6ff;
        color: #1d4ed8;
    }

    .empty {
        text-align: center;
        color: #64748b;
        padding: 30px;
    }
</style>


</head>

<body>
<div class="container">


<div class="header">
    <div>
        <h1>All Scheduled Exams</h1>
        <p class="subtitle">View your examination timetable.</p>
    </div>

    <div>
        <a href="/" class="button back">Dashboard</a>
        <a href="/exams/new" class="button">+ Add Exam</a>
    </div>
</div>

<div class="message"
     th:if="${successMessage}"
     th:text="${successMessage}">
    Exam scheduled successfully!
</div>

<div style="background:white;padding:20px;border-radius:10px;margin-bottom:20px;">

    <form action="/exams" method="get"
          style="display:flex;gap:10px;flex-wrap:wrap;">

        <input type="text"
               name="keyword"
               th:value="${keyword}"
               placeholder="Search by subject name..."
               style="flex:1;min-width:200px;padding:12px;border:1px solid #cbd5e1;border-radius:7px;">

        <button type="submit"
                style="background:#1d4ed8;color:white;border:none;padding:12px 20px;border-radius:7px;cursor:pointer;">
            Search
        </button>

        <a href="/exams"
           style="background:#e2e8f0;color:#1e293b;padding:12px 20px;border-radius:7px;text-decoration:none;">
            Clear
        </a>

    </form>

</div>

<div class="table-container">
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Subject</th>
                <th>Date</th>
                <th>Time</th>
                <th>Duration</th>
                <th>Venue</th>
				<th>Action</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="exam : ${exams}">
                <td th:text="${exam.id}"></td>
                <td th:text="${exam.subjectName}"></td>
                <td th:text="${exam.examDate}"></td>
                <td th:text="${exam.examTime}"></td>
                <td th:text="${exam.durationMinutes + ' minutes'}"></td>
                <td th:text="${exam.venue}"></td>
<td>
    <!-- Edit Button -->
    <a th:href="@{/exams/edit/{id}(id=${exam.id})}"
       style="display:inline-block;
              background:#2563eb;
              color:white;
              padding:8px 12px;
              border-radius:5px;
              text-decoration:none;
              margin-right:5px;">
        Edit
    </a>

    <!-- Delete Button -->
    <form th:action="@{/exams/delete/{id}(id=${exam.id})}"
          method="post"
          style="display:inline;"
          onsubmit="return confirm('Are you sure you want to delete this exam?');">

        <button type="submit"
                style="background:#dc2626;
                       color:white;
                       border:none;
                       padding:8px 12px;
                       border-radius:5px;
                       cursor:pointer;">
            Delete
        </button>
    </form>
</td>
            </tr>

            <tr th:if="${#lists.isEmpty(exams)}">
                <td colspan="7" class="empty">
                    No exams scheduled yet. Click “Add Exam” to get started.
                </td>
            </tr>
        </tbody>
    </table>
</div>


</div>
</body>
</html>
